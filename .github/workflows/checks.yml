name: App checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fitmy_test
          POSTGRES_PASSWORD: test_only
          POSTGRES_DB: fitmy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fitmy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://fitmy_test:test_only@localhost:5432/fitmy_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r requirements.txt
      - run: python -m compileall -q main.py
      - run: python -m unittest discover -s tests -v
      - run: node tests/frontend.cjs
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: node tests/browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mobile-check
          path: mobile-check.png
